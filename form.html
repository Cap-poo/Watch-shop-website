<!DOCTYPE html>
<html lang="en">
<head>
   <meta name="viewport" content="form" author="digi shrestha">
   <title>Order Form</title>

   <!-- Internal CSS -->
   <style>
      body {
         font-family: Arial, sans-serif;
         background-color: #f4f4f9;
         display: flex;
         justify-content: center;
         align-items: center;
         height: 100vh;
         margin: 0;
      }

      form {
         background: #fff;
         padding: 20px;
         border-radius: 8px;
         box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
         width: 300px;
         text-align: center;
      }

      form input {
         width: 100%;
         padding: 10px;
         margin: 10px 0;
         border-radius: 5px;
         border: 1px solid #ccc;
         box-sizing: border-box;
      }

      form button {
         background-color: #27ae60;
         color: white;
         border: none;
         padding: 10px 20px;
         border-radius: 5px;
         font-size: 16px;
         cursor: pointer;
         width: 100%;
      }

      form button:hover {
         background-color: #2ecc71;
      }

      /* alert styling*/
      .popup {
         position: fixed;
         bottom: 20px;
         right: 20px;
         background-color: green;
         color: white;
         padding: 10px;
         border-radius: 5px;
         font-size: 16px;
         box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
         z-index: 1000;
      }
   </style>

</head>
<body>

   <!-- Order Form -->
   <form id="orderForm" onsubmit="return validateOrder()">
      <h2>Place Your Order</h2>

      <label for="productName">Product Name:</label>
      <input type="text" id="productName" name="productName" required><br><br>
      
      <label for="quantity">Quantity:</label>
      <input type="number" id="quantity" name="quantity" required><br><br>
      
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required><br><br>
      
      <button type="submit"> Order Now</button>
   </form>

   <script>
      // Function 
      function showOrderPopup() {
         const popup = document.createElement('div');
         popup.classList.add('popup');
         popup.textContent = 'Your order has been placed!';
         document.body.appendChild(popup);

         setTimeout(() => popup.remove(), 2000);  // Remove popup after 2 seconds
      }

      // Function 
      function validateOrder() {
         const productName = document.getElementById('productName').value;
         const quantity = document.getElementById('quantity').value;
         const email = document.getElementById('email').value;

         // alert display hunxa
         alert(`Order Placed!\nProduct: ${productName}\nQuantity: ${quantity}\nEmail: ${email}`);

         // Show order confirmation 
         showOrderPopup();

         // Prevent form from submitting and page reload
         return false;
      }
   </script>

</body>
</html>
